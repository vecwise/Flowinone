[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowinone"
version = "0.1.0"
description = "Unified visual knowledge hub combining Eagle, local media, and Chrome bookmarks."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Flowinone Developers"}
]
dependencies = [
    "Flask>=2.2.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "Pillow>=10",
    "SQLAlchemy>=2.0",
    "Alembic>=1.13",
    "trafilatura>=1.12",
    "pypdf>=4",
    "PyMuPDF>=1.24",
    "markdownify>=0.13",
    "yt-dlp"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["pytesseract>=0.3.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "online: performs public network smoke tests (set FLOWINONE_ONLINE_SMOKE=1)",
    "performance: synthetic local performance contract",
]

[project.urls]
Homepage = "https://github.com/your-name/flowinone"
Documentation = "https://github.com/your-name/flowinone#readme"

[tool.setuptools]
py-modules = ["config", "routes", "run"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eagle_api*", "file_handler*", "flowinone*"]

[tool.setuptools.package-data]
"*" = ["templates/*.html", "static/**/*", "data/**/*"]
