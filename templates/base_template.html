<!-- templates/base_template.html -->
<!DOCTYPE html>
<html lang="zh-Hant" data-ui="{{ ui_key }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default('Flowinone') }}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav_styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flowinone_os.css') }}">

    {% block custom_style %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui_pages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui_variants.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catalog_compact.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery_media.css') }}">

</head>

<body>
    <a class="skip-link" href="#main-content">跳到主要內容</a>
    <header class="app-header">
      {% include '_navbar.html' %}
    </header>
    {% block page_content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/compact_menus.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui_switcher.js') }}"></script>
    <script src="{{ url_for('static', filename='js/browse_sources.js') }}"></script>
</body>
</html>
